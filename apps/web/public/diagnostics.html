<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mirastros — проверка загрузки</title>
<style>
body{margin:0;background:#080b1a;color:#f0e6ff;font:16px/1.65 -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:820px;margin:40px auto;padding:25px;border:1px solid #c7a57570;background:#1a123d}h1{font:normal 30px Georgia,serif;color:#ffd9a6}p{color:#c8bbd4}button,a{display:inline-block;margin:8px 12px 8px 0;padding:12px 18px;border:1px solid #c7a575;background:#2b1848;color:#ffd9a6;font:inherit;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}textarea{display:block;box-sizing:border-box;width:100%;height:420px;padding:15px;background:#080b1a;color:#f0e6ff;border:1px solid #c7a575;font:12px/1.6 monospace}button:focus,a:focus,textarea:focus{outline:2px solid #d8b8ff;outline-offset:3px}#status{min-height:1.8em}@media(max-width:600px){main{margin:15px;padding:18px}h1{font-size:25px}textarea{font-size:11px}}
</style>
</head>
<body><main>
<h1>Проверка загрузки Mirastros</h1>
<p>Откройте эту страницу в браузере, где сайт не работает. Проверка обычно занимает до 30 секунд. Затем скопируйте отчёт и отправьте его в чат.</p>
<p id="status" role="status">Запускаем проверку…</p>
<noscript><p>JavaScript отключён или заблокирован. Это мешает запуску сайта. Сообщите об этом в чат.</p></noscript>
<label for="report">Отчёт о загрузке</label>
<textarea id="report" readonly spellcheck="false">Если отчёт не появился, сообщите: «Даже на странице диагностики не запускается JavaScript».</textarea>
<button type="button" id="copy">Скопировать отчёт</button><button type="button" id="retry">Повторить проверку</button><a href="/">Открыть сайт</a>
<p id="copy-status" role="status"></p>
</main>
<script>
/* ES5 intentionally: this page must run even if the application cannot boot.
   No third-party dependencies, credentials, account access or report uploads. */
(function () {
  'use strict';
  var output = document.getElementById('report');
  var status = document.getElementById('status');
  var retry = document.getElementById('retry');
  var lines = [], requests = [], running = false, generation = 0;
  function add(text) { lines.push(text); output.value = lines.join('\n'); }
  function feature(label, value) { add(label + ': ' + (value ? 'да' : 'нет')); }
  function paths(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var nodes = doc.querySelectorAll('script[src],link[href]'), result = [], seen = {};
    for (var i = 0; i < nodes.length; i++) {
      var path = (nodes[i].getAttribute('src') || nodes[i].getAttribute('href') || '').split('?')[0];
      if (/^\/_next\/static\/[^\s]+\.(js|css)$/.test(path) && !seen[path]) { seen[path] = true; result.push(path); }
    }
    return result;
  }
  function read(path, done) {
    var xhr = new XMLHttpRequest(), settled = false, started = new Date().getTime(), current = generation;
    requests.push(xhr);
    function finish(kind) {
      if (settled || current !== generation) return;
      settled = true;
      var code = 0, type = '', text = '';
      try { code = xhr.status; type = xhr.getResponseHeader('Content-Type') || ''; text = xhr.responseText || ''; } catch (ignore) {}
      var result = {code:code, type:type, text:text, milliseconds:new Date().getTime()-started, kind:kind};
      done(result);
    }
    xhr.open('GET', path, true); xhr.timeout = 8000;
    xhr.onload = function () { finish('ответ'); };
    xhr.onerror = function () { finish('сетевая ошибка'); };
    xhr.ontimeout = function () { finish('таймаут'); };
    xhr.onabort = function () { finish('прервано'); };
    try { xhr.send(null); } catch (error) { finish(String(error.message || error)); }
  }
  function note(path, result) {
    var text = 'HTTP ' + result.code + ' · ' + result.milliseconds + ' мс · ' + path;
    if (!result.code) text += ' · ' + result.kind;
    if (result.code === 200 && /\.js$/.test(path) && (!/javascript|ecmascript/.test(result.type) || /^\s*</.test(result.text))) text += ' · ОШИБКА: вместо JavaScript получен другой формат (' + result.type + ')';
    if (result.code === 200 && /\.css$/.test(path) && !/text\/css/.test(result.type)) text += ' · ОШИБКА формата CSS: ' + result.type;
    add(text);
    if (result.code === 200 && /\.js$/.test(path) && /javascript|ecmascript/.test(result.type) && !/^\s*</.test(result.text)) {
      try { new Function(result.text); }
      catch (error) { add((error.name === 'SyntaxError' ? 'ОШИБКА синтаксиса JS в этом браузере: ' : 'Проверка синтаксиса ограничена браузером: ') + path + ' · ' + String(error.message || error).slice(0, 160)); }
    }
  }
  function checkAssets(list, done) {
    var next = 0, active = 0, stopped = false;
    list = list.slice(0, 16);
    function pump() {
      if (stopped) return;
      while (active < 3 && next < list.length) {
        (function (path) {
          active++;
          read(path, function (result) { note(path, result); active--; pump(); });
        }(list[next++]));
      }
      if (!active && next === list.length) { stopped = true; done(); }
    }
    pump();
  }
  function start() {
    if (running) return;
    running = true; generation++; requests = []; lines = [];
    retry.disabled = true; status.textContent = 'Проверяем браузер и файлы сайта…';
    add('MIRASTROS LOAD REPORT v1');
    add('Время UTC: ' + new Date().toISOString());
    add('Адрес: ' + location.protocol + '//' + location.host + location.pathname);
    add('Браузер: ' + navigator.userAgent);
    add('Экран: ' + window.innerWidth + ' × ' + window.innerHeight + ', DPR ' + (window.devicePixelRatio || 1));
    feature('Promise', typeof window.Promise === 'function');
    feature('Promise.allSettled', !!(window.Promise && window.Promise.allSettled));
    feature('Object.fromEntries', typeof Object.fromEntries === 'function');
    feature('AbortController', typeof window.AbortController === 'function');
    feature('ResizeObserver', typeof window.ResizeObserver === 'function');
    add('Видимость страницы: ' + (document.visibilityState || 'неизвестно'));
    var video = document.createElement('video');
    add('Видео H.264: ' + (video.canPlayType('video/mp4; codecs="avc1.42E01E"') || 'не поддерживается'));
    add('Видео WebM: ' + (video.canPlayType('video/webm; codecs="vp9"') || 'не поддерживается'));
    feature('CSS 3D', !!(window.CSS && CSS.supports && CSS.supports('transform-style', 'preserve-3d')));
    try { feature('MediaQueryList.addEventListener', typeof matchMedia('(pointer: coarse)').addEventListener === 'function'); } catch (ignore) { feature('matchMedia', false); }
    try { new Function('var x = {}; return x?.a;'); feature('Синтаксис optional chaining', true); } catch (ignore) { feature('Синтаксис optional chaining', false); }
    try { window.scrollTo({top:window.pageYOffset, behavior:'instant'}); feature('scrollTo instant', true); } catch (ignore) { feature('scrollTo instant', false); }
    try { sessionStorage.setItem('mira:diagnostic-check', '1'); sessionStorage.removeItem('mira:diagnostic-check'); feature('sessionStorage', true); } catch (ignore) { feature('sessionStorage', false); }
    try { localStorage.setItem('mira:diagnostic-check', '1'); localStorage.removeItem('mira:diagnostic-check'); feature('localStorage', true); } catch (ignore) { feature('localStorage', false); }
    add('');
    var completed = false, probesLeft = 2, assetsFinished = false;
    function maybeFinish() { if (probesLeft === 0 && assetsFinished) finish(); }
    function skipAssets(message) { add(message); assetsFinished = true; maybeFinish(); }
    var deadline = setTimeout(function () { finish('Общий лимит 30 секунд. Незавершённые запросы могут быть заблокированы сетью или расширением.'); }, 30000);
    function finish(message) {
      if (completed) return;
      completed = true;
      clearTimeout(deadline);
      if (message) add(message);
      add('Проверка завершена. Отчёт можно скопировать.');
      status.textContent = 'Проверка завершена — скопируйте отчёт.';
      running = false; retry.disabled = false;
      generation++;
      for (var i = 0; i < requests.length; i++) { try { requests[i].abort(); } catch (ignore) {} }
    }
    read('/api/health/readiness', function (result) { note('/api/health/readiness', result); probesLeft--; maybeFinish(); });
    read('/vendor/splitting/splitting.css', function (result) { note('/vendor/splitting/splitting.css', result); probesLeft--; maybeFinish(); });
    read('/', function (cached) {
      note('/ (обычный запрос)', cached);
      read('/?mira-check=' + new Date().getTime(), function (fresh) {
        note('/ (запрос без старого кэша)', fresh);
        if (fresh.code !== 200) { skipAssets('Не удалось загрузить HTML главной страницы.'); return; }
        if (!/text\/html/.test(fresh.type) || !fresh.text || fresh.text.indexOf('_next/static') < 0) { skipAssets('ОШИБКА: сервер вернул не страницу приложения Next.js.'); return; }
        try {
          var regular = paths(cached.text || ''), assets = paths(fresh.text);
          add('Версии файлов обычной и свежей страницы: ' + (regular.join('|') === assets.join('|') ? 'совпадают' : 'РАЗЛИЧАЮТСЯ'));
          var all = [];
          for (var i = 0; i < regular.length; i++) if (assets.indexOf(regular[i]) < 0) all.push(regular[i]);
          all = all.concat(assets);
          add('Найдено JS/CSS файлов: ' + all.length + ' (проверяем до 16)');
          if (!all.length) { skipAssets('ОШИБКА: в ответе отсутствуют файлы приложения.'); return; }
          checkAssets(all, function () { assetsFinished = true; maybeFinish(); });
        } catch (error) { skipAssets('Не удалось разобрать страницу: ' + String(error.message || error)); }
      });
    });
  }
  document.getElementById('retry').onclick = start;
  document.getElementById('copy').onclick = function () {
    var message = document.getElementById('copy-status');
    output.focus(); output.select(); output.setSelectionRange(0, output.value.length);
    try { message.textContent = document.execCommand('copy') ? 'Отчёт скопирован. Вставьте его в чат.' : 'Отчёт выделен. Нажмите Command+C и вставьте его в чат.'; }
    catch (ignore) { message.textContent = 'Отчёт выделен. Нажмите Command+C и вставьте его в чат.'; }
  };
  window.onerror = function (message) { add('Ошибка диагностики: ' + String(message)); running = false; retry.disabled = false; };
  start();
}());
</script>
</body></html>
